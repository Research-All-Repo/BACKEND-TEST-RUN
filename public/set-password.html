<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password · AquaCast</title>
  <link rel="icon" href="/img/aquacast-logo.webp">
  <link rel="stylesheet" href="/css/aquacast.css">
  <link rel="stylesheet" href="/css/aquacast-extra.css">
  <script type="module" src="/js/set-password.js"></script>
</head>
<body>
  <!-- Landing page for Supabase password-reset and invitation links.
       Add  <PUBLIC_SITE_URL>/set-password.html  to Supabase Auth -> URL Configuration -> Redirect URLs. -->
  <div class="auth2-page">
    <div class="auth2-grid-overlay"></div><div class="auth2-glow auth2-glow-one"></div><div class="auth2-glow auth2-glow-two"></div>
    <div class="auth2-water-line auth2-water-line-one"></div><div class="auth2-water-line auth2-water-line-two"></div>
    <main class="auth2-card">
      <div class="auth2-brand"><img class="auth2-logo" src="/img/aquacast-logo.webp" alt="AquaCast logo"><div><h1>AquaCast</h1><p>Early-Warning &amp; Decision-Support System</p></div></div>
      <div class="auth2-view">
        <div class="auth2-heading"><span>Account Security</span><h2>Set your password</h2><p>Choose a new password for your AquaCast account (at least 10 characters).</p></div>
        <div id="pw-msg"></div>
        <form class="auth2-form" id="pw-form" novalidate>
          <div class="auth2-form-group"><label for="pw-new">New Password</label>
            <div class="auth2-input"><span data-icon="lock"></span><input id="pw-new" name="password" type="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters"></div></div>
          <div class="auth2-form-group"><label for="pw-confirm">Confirm Password</label>
            <div class="auth2-input"><span data-icon="lock"></span><input id="pw-confirm" name="confirm" type="password" minlength="10" required autocomplete="new-password" placeholder="Re-enter the password"></div></div>
          <button type="submit" class="auth2-primary-button"><span data-icon="key-round"></span>Save Password</button>
        </form>
        <div class="auth2-request-link"><p>Already set your password?</p><button type="button" id="pw-back">Back to Sign In</button></div>
      </div>
    </main>
    <footer class="auth2-footer">AquaCast • Early-Warning &amp; Decision-Support System</footer>
  </div>
</body>
</html>
