<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password · AquaCast</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/set-password.js"></script>
</head>
<body>
  <!-- Landing page for Supabase password-reset and invitation links.
       Add  <PUBLIC_SITE_URL>/set-password.html  to Supabase Auth -> URL Configuration -> Redirect URLs. -->
  <section class="auth-wrap">
    <div class="auth-card">
      <h1>AquaCast</h1>
      <h2>Set your password</h2>
      <form id="pw-form">
        <label>New password (min. 10 characters)</label><input name="password" type="password" minlength="10" required autocomplete="new-password">
        <label>Confirm password</label><input name="confirm" type="password" minlength="10" required autocomplete="new-password">
        <button class="primary full" type="submit">Save password</button>
      </form>
      <div id="pw-msg" class="notice hidden"></div>
      <div class="small" style="margin-top:12px"><a href="/">Back to sign in</a></div>
    </div>
  </section>
</body>
</html>
